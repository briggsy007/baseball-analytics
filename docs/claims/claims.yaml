# Claims registry -- WS2.2 (plan docs/plans/2026-08-10_platform_improvement_plan.md §2.2)
#
# One entry per reportable number (HF model-index-inspired). This file is the
# ONLY sanctioned source for headline numbers rendered on dashboards or quoted
# in outward-facing docs (kill criterion K6). Access via
# src/claims.py::get_claim(id) -- it raises ClaimRetracted on retracted
# entries and always returns the mandatory caveat alongside the value.
#
# Statuses:
#   active     -- current defensible claim; quote WITH the caveat.
#   narrowed   -- the number stands but only inside the stated bounds; the
#                 caveat is load-bearing, not optional.
#   retracted  -- must never render; get_claim raises. Views may reference the
#                 id only to BOUND the old number (demotion banners, errata).
#   superseded -- replaced by superseded_by; quote the successor instead.
#
# Editing rules: never soften a caveat after seeing new results; retractions
# are append-only state transitions (active -> narrowed -> retracted), never
# reversed silently. Dataset hashes are sha256 of the artifact at registration.
# Canonical wording follows the 2026-08-10 audit
# (docs/audits/FLAGSHIP_AUDIT_2026-08-10.md) and the Batch-A correction pass.

